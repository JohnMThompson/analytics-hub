services:
  backend:
    ports: !reset []
    expose:
      - "8000"
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    networks:
      ai-analytics:
      web:
        aliases:
          - analytics-backend

  frontend:
    ports: !reset []
    build:
      args:
        VITE_API_URL: ""
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    expose:
      - "3000"
    networks:
      ai-analytics:
      web:
        aliases:
          - analytics-frontend

networks:
  web:
    external: true
